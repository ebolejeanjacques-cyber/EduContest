<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Résultats — Administration — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Tous les résultats</h2>

      <form class="row g-2 mb-3" id="filter-form">
        <div class="col-md-6">
          <select class="form-select" id="comp-select"><option value="">Tous les concours</option></select>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-hover bg-white shadow-sm rounded align-middle">
          <thead class="table-light">
            <tr><th>Participant</th><th>Concours</th><th>Score</th><th>%</th><th>Date</th></tr>
          </thead>
          <tbody id="list"><tr><td colspan="5" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
let allResults = [], compMap = {}, userMap = {};

async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["admin"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Utilisateurs", href: "users.html", icon: "bi-people" },
    { label: "Concours", href: "competitions.html", icon: "bi-list-task" },
    { label: "Catégories", href: "categories.html", icon: "bi-tags" },
    { label: "Résultats", href: "results.html", icon: "bi-bar-chart", active: true },
    { label: "Paramètres", href: "settings.html", icon: "bi-gear" },
  ], "../");

  const [results, comps, users] = await Promise.all([
    DB.getAll("results"), DB.getAll("competitions"), DB.getAll("users"),
  ]);
  allResults = results.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  comps.forEach(c => compMap[c.id] = c);
  users.forEach(u => userMap[u.id] = u);

  const select = document.getElementById("comp-select");
  comps.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id; opt.textContent = c.title;
    select.appendChild(opt);
  });
  select.addEventListener("change", render);

  render();
}

function render() {
  const filter = document.getElementById("comp-select").value;
  const list = filter ? allResults.filter(r => r.competitionId === filter) : allResults;
  const tbody = document.getElementById("list");
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted-edu py-3">Aucun résultat.</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(r => `
    <tr>
      <td>${App.escapeHtml(userMap[r.userId] ? userMap[r.userId].name : '-')}</td>
      <td>${App.escapeHtml(compMap[r.competitionId] ? compMap[r.competitionId].title : '-')}</td>
      <td>${r.score} / ${r.maxScore}</td>
      <td><span class="badge bg-primary">${r.percentage}%</span></td>
      <td>${App.formatDate(r.createdAt)}</td>
    </tr>`).join("");
}

init();
</script>
</body>
</html>
