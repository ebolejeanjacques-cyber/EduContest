<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Résultats — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title" id="page-title">Résultats &amp; classement</h2>
      <div class="table-responsive">
        <table class="table table-hover bg-white shadow-sm rounded align-middle">
          <thead class="table-light">
            <tr><th>#</th><th>Participant</th><th>Score</th><th>%</th><th>Temps</th><th>Date</th></tr>
          </thead>
          <tbody id="list"><tr><td colspan="6" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/results.js"></script>
<script src="../js/ranking.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const competitionId = params.get("competitionId");

async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["organizer"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Créer un concours", href: "create-competition.html", icon: "bi-plus-circle" },
    { label: "Mes concours", href: "competitions.html", icon: "bi-list-task", active: true },
  ], "../");

  const comp = competitionId ? await DB.get("competitions", competitionId) : null;
  if (!comp || comp.organizerId !== user.id) {
    document.getElementById("list").innerHTML = `<tr><td colspan="6" class="text-center text-danger py-3">Accès non autorisé.</td></tr>`;
    return;
  }
  document.getElementById("page-title").textContent = `Résultats — ${comp.title}`;

  const ranking = await Ranking.getRankingForCompetition(comp.id);
  const tbody = document.getElementById("list");
  if (ranking.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted-edu py-3">Aucun résultat pour ce concours pour le moment.</td></tr>`;
    return;
  }
  tbody.innerHTML = ranking.map(r => `
    <tr>
      <td><span class="rank-badge ${r.position <= 3 ? 'rank-' + r.position : ''}">${r.position}</span></td>
      <td>${App.escapeHtml(r.user ? r.user.name : '-')}</td>
      <td>${r.score} / ${r.maxScore}</td>
      <td>${r.percentage}%</td>
      <td>${Math.floor(r.timeUsed / 60)} min ${r.timeUsed % 60}s</td>
      <td>${App.formatDate(r.createdAt)}</td>
    </tr>`).join("");
}
init();
</script>
</body>
</html>
