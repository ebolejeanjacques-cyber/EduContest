<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon profil — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Mon profil</h2>
      <div id="alert-container"></div>
      <div class="card p-4 col-md-8">
        <form id="profile-form">
          <div class="mb-3">
            <label class="form-label">Nom complet</label>
            <input type="text" class="form-control" id="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Adresse email</label>
            <input type="email" class="form-control" id="email" disabled>
            <div class="form-text">L'email ne peut pas être modifié dans cette démo.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Rôle</label>
            <input type="text" class="form-control" id="role" disabled>
          </div>
          <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
let user;
async function init() {
  await DB.openDatabase();
  user = await App.initProtectedPage(["participant"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Concours disponibles", href: "competitions.html", icon: "bi-list-task" },
    { label: "Mes participations", href: "history.html", icon: "bi-clock-history" },
    { label: "Classement", href: "ranking.html", icon: "bi-trophy" },
    { label: "Mon profil", href: "profile.html", icon: "bi-person-circle", active: true },
  ], "../");

  const fullUser = await DB.get("users", user.id);
  document.getElementById("name").value = fullUser.name;
  document.getElementById("email").value = fullUser.email;
  document.getElementById("role").value = fullUser.role;
}

document.getElementById("profile-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  if (!name) return;
  const fullUser = await DB.get("users", user.id);
  fullUser.name = name;
  await DB.put("users", fullUser);
  // Met à jour la session active.
  const session = Auth.getCurrentUser();
  session.name = name;
  sessionStorage.setItem("educontest_session", JSON.stringify(session));
  App.showAlert("alert-container", "Profil mis à jour avec succès.", "success");
  App.renderNavbar("../");
});

init();
</script>
</body>
</html>
