<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Détails du concours — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-5" id="content">
  <div class="text-center py-5 text-muted-edu">Chargement...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/competitions.js"></script>
<script src="../js/questions.js"></script>
<script src="../js/participants.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const compId = params.get("id");

async function init() {
  await DB.openDatabase();
  await Auth.ensureSession();
  App.renderNavbar("../");

  const comp = compId ? await DB.get("competitions", compId) : null;
  const content = document.getElementById("content");
  if (!comp) {
    content.innerHTML = `<div class="alert alert-warning">Concours introuvable. <a href="../index.html">Retour à l'accueil</a></div>`;
    return;
  }
  comp.status = App.computeCompetitionStatus(comp);
  const catMap = await Competitions.getCategoryMap();
  const questions = await Questions.getQuestionsForCompetition(comp.id);
  const organizer = await DB.get("users", comp.organizerId);

  const user = Auth.getCurrentUser();
  let actionHtml = `<a href="../login.html" class="btn btn-primary btn-lg">Connectez-vous pour participer</a>`;
  if (user && user.role === "participant") {
    actionHtml = `<a href="../participant/details.html?id=${comp.id}" class="btn btn-primary btn-lg">Voir dans mon espace participant</a>`;
  } else if (user && user.role !== "participant") {
    actionHtml = `<span class="text-muted-edu">Connectez-vous avec un compte participant pour vous inscrire.</span>`;
  }

  content.innerHTML = `
    <div class="row">
      <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="card-cat">${App.escapeHtml(catMap[comp.categoryId] || "Général")}</span>
          ${App.statusBadgeHtml(comp.status)}
        </div>
        <h1>${App.escapeHtml(comp.title)}</h1>
        <p class="lead text-muted-edu">${App.escapeHtml(comp.description)}</p>
        <div class="mt-4">${actionHtml}</div>
      </div>
      <div class="col-lg-4">
        <div class="card p-3">
          <h6 class="fw-bold">Informations</h6>
          <ul class="list-unstyled small">
            <li class="mb-2"><i class="bi bi-bar-chart me-2"></i>Niveau : <strong>${App.escapeHtml(comp.level)}</strong></li>
            <li class="mb-2"><i class="bi bi-calendar-event me-2"></i>Début : ${App.formatDateTime(comp.startDate)}</li>
            <li class="mb-2"><i class="bi bi-calendar-check me-2"></i>Fin : ${App.formatDateTime(comp.endDate)}</li>
            <li class="mb-2"><i class="bi bi-stopwatch me-2"></i>Durée : ${comp.duration} minutes</li>
            <li class="mb-2"><i class="bi bi-question-circle me-2"></i>${questions.length} question(s) — ${comp.pointsPerQuestion} pt/question</li>
            <li class="mb-0"><i class="bi bi-person-badge me-2"></i>Organisé par : ${App.escapeHtml(organizer ? organizer.name : "-")}</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}
init();
</script>
</body>
</html>
