<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestion des catégories — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Gestion des catégories</h2>
      <div id="alert-container"></div>

      <div class="card p-3 mb-4">
        <form id="cat-form" class="row g-2 align-items-end">
          <div class="col-md-8">
            <label class="form-label">Nom de la nouvelle catégorie</label>
            <input type="text" class="form-control" id="cat-name" required>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
          </div>
        </form>
      </div>

      <div class="table-responsive">
        <table class="table bg-white shadow-sm rounded align-middle">
          <thead class="table-light"><tr><th>Nom</th><th>Concours associés</th><th>Actions</th></tr></thead>
          <tbody id="list"><tr><td colspan="3" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["admin"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Utilisateurs", href: "users.html", icon: "bi-people" },
    { label: "Concours", href: "competitions.html", icon: "bi-list-task" },
    { label: "Catégories", href: "categories.html", icon: "bi-tags", active: true },
    { label: "Résultats", href: "results.html", icon: "bi-bar-chart" },
    { label: "Paramètres", href: "settings.html", icon: "bi-gear" },
  ], "../");

  await renderList();
}

async function renderList() {
  const [cats, comps] = await Promise.all([DB.getAll("categories"), DB.getAll("competitions")]);
  const tbody = document.getElementById("list");
  if (cats.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted-edu py-3">Aucune catégorie.</td></tr>`;
    return;
  }
  tbody.innerHTML = cats.map(c => {
    const count = comps.filter(comp => comp.categoryId === c.id).length;
    return `
      <tr>
        <td id="name-${c.id}">${App.escapeHtml(c.name)}</td>
        <td>${count}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary" onclick="renameCategory('${c.id}', '${App.escapeHtml(c.name).replace(/'/g, "\\'")}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" ${count > 0 ? `disabled title="Catégorie utilisée par ${count} concours"` : ""} onclick="deleteCategory('${c.id}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`;
  }).join("");
}

document.getElementById("cat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("cat-name").value.trim();
  if (!name) return;
  await DB.add("categories", { id: DB.generateId("cat"), name });
  document.getElementById("cat-name").value = "";
  App.showAlert("alert-container", "Catégorie ajoutée avec succès.", "success");
  await renderList();
});

async function renameCategory(id, currentName) {
  const newName = prompt("Nouveau nom de la catégorie :", currentName);
  if (!newName || !newName.trim() || newName.trim() === currentName) return;
  const cat = await DB.get("categories", id);
  cat.name = newName.trim();
  await DB.put("categories", cat);
  App.showAlert("alert-container", "Catégorie renommée avec succès.", "success");
  await renderList();
}

async function deleteCategory(id) {
  if (!confirm("Supprimer cette catégorie ?")) return;
  await DB.delete("categories", id);
  App.showAlert("alert-container", "Catégorie supprimée.", "success");
  await renderList();
}

init();
</script>
</body>
</html>
