<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — Administrateur — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Tableau de bord administrateur</h2>

      <div class="row mb-4">
        <div class="col-md-3 mb-3"><div class="stat-card"><div class="stat-value" id="stat-users">0</div><div>Utilisateurs</div></div></div>
        <div class="col-md-3 mb-3"><div class="stat-card amber"><div class="stat-value" id="stat-comps">0</div><div>Concours</div></div></div>
        <div class="col-md-3 mb-3"><div class="stat-card"><div class="stat-value" id="stat-participations">0</div><div>Participations</div></div></div>
        <div class="col-md-3 mb-3"><div class="stat-card amber"><div class="stat-value" id="stat-results">0</div><div>Résultats</div></div></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-4">
          <div class="card p-3">
            <h6 class="fw-bold mb-3">Répartition des utilisateurs</h6>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">Participants <span class="badge bg-primary" id="count-participants">0</span></li>
              <li class="list-group-item d-flex justify-content-between">Organisateurs <span class="badge bg-warning text-dark" id="count-organizers">0</span></li>
              <li class="list-group-item d-flex justify-content-between">Administrateurs <span class="badge bg-secondary" id="count-admins">0</span></li>
            </ul>
          </div>
        </div>
        <div class="col-md-6 mb-4">
          <div class="card p-3">
            <h6 class="fw-bold mb-3">Accès rapide</h6>
            <div class="d-grid gap-2">
              <a href="users.html" class="btn btn-outline-primary"><i class="bi bi-people me-1"></i>Gérer les utilisateurs</a>
              <a href="competitions.html" class="btn btn-outline-primary"><i class="bi bi-list-task me-1"></i>Gérer les concours</a>
              <a href="categories.html" class="btn btn-outline-primary"><i class="bi bi-tags me-1"></i>Gérer les catégories</a>
              <a href="settings.html" class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i>Export / Import des données</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/results.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["admin"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2", active: true },
    { label: "Utilisateurs", href: "users.html", icon: "bi-people" },
    { label: "Concours", href: "competitions.html", icon: "bi-list-task" },
    { label: "Catégories", href: "categories.html", icon: "bi-tags" },
    { label: "Résultats", href: "results.html", icon: "bi-bar-chart" },
    { label: "Paramètres", href: "settings.html", icon: "bi-gear" },
  ], "../");

  const stats = await Results.getGlobalStats();
  document.getElementById("stat-users").textContent = stats.totalUsers;
  document.getElementById("stat-comps").textContent = stats.totalCompetitions;
  document.getElementById("stat-participations").textContent = stats.totalParticipations;
  document.getElementById("stat-results").textContent = stats.totalResults;
  document.getElementById("count-participants").textContent = stats.totalParticipants;
  document.getElementById("count-organizers").textContent = stats.totalOrganizers;
  document.getElementById("count-admins").textContent = stats.totalAdmins;
}
init();
</script>
</body>
</html>
