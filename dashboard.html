<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — Organisateur — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title mb-0">Tableau de bord organisateur</h2>
        <a href="create-competition.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Créer un concours</a>
      </div>

      <div class="row mb-4">
        <div class="col-md-4 mb-3">
          <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div>Mes concours</div></div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="stat-card amber"><div class="stat-value" id="stat-active">0</div><div>En cours</div></div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="stat-card"><div class="stat-value" id="stat-participants">0</div><div>Participations reçues</div></div>
        </div>
      </div>

      <h5 class="mb-3">Mes concours récents</h5>
      <div class="table-responsive">
        <table class="table bg-white shadow-sm rounded">
          <thead class="table-light"><tr><th>Titre</th><th>Statut</th><th>Dates</th><th></th></tr></thead>
          <tbody id="list"><tr><td colspan="4" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/competitions.js"></script>
<script src="../js/participants.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["organizer"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2", active: true },
    { label: "Créer un concours", href: "create-competition.html", icon: "bi-plus-circle" },
    { label: "Mes concours", href: "competitions.html", icon: "bi-list-task" },
  ], "../");

  const comps = await Competitions.getCompetitionsByOrganizer(user.id);
  document.getElementById("stat-total").textContent = comps.length;
  document.getElementById("stat-active").textContent = comps.filter(c => c.status === "En cours").length;

  let totalParticipations = 0;
  for (const c of comps) {
    const ps = await Participants.getParticipantsForCompetition(c.id);
    totalParticipations += ps.length;
  }
  document.getElementById("stat-participants").textContent = totalParticipations;

  const tbody = document.getElementById("list");
  const recent = [...comps].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6);
  if (recent.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted-edu py-3">Aucun concours créé. <a href="create-competition.html">Créez votre premier concours</a>.</td></tr>`;
  } else {
    tbody.innerHTML = recent.map(c => `
      <tr>
        <td>${App.escapeHtml(c.title)}</td>
        <td>${App.statusBadgeHtml(c.status)}</td>
        <td class="small">${App.formatDate(c.startDate)} → ${App.formatDate(c.endDate)}</td>
        <td><a href="questions.html?competitionId=${c.id}" class="btn btn-sm btn-outline-primary">Gérer</a></td>
      </tr>`).join("");
  }
}
init();
</script>
</body>
</html>
