<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — Participant — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Tableau de bord</h2>
      <div id="welcome" class="mb-4"></div>

      <div class="row mb-4">
        <div class="col-md-4 mb-3">
          <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div>Participations</div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="stat-card amber">
            <div class="stat-value" id="stat-avg">0%</div>
            <div>Moyenne des scores</div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="stat-card">
            <div class="stat-value" id="stat-available">0</div>
            <div>Concours en cours</div>
          </div>
        </div>
      </div>

      <h5 class="mb-3">Derniers résultats</h5>
      <div class="table-responsive">
        <table class="table bg-white shadow-sm rounded">
          <thead class="table-light"><tr><th>Concours</th><th>Score</th><th>%</th><th>Date</th></tr></thead>
          <tbody id="recent-results"><tr><td colspan="4" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/competitions.js"></script>
<script src="../js/participants.js"></script>
<script src="../js/results.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["participant"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2", active: true },
    { label: "Concours disponibles", href: "competitions.html", icon: "bi-list-task" },
    { label: "Mes participations", href: "history.html", icon: "bi-clock-history" },
    { label: "Classement", href: "ranking.html", icon: "bi-trophy" },
    { label: "Mon profil", href: "profile.html", icon: "bi-person-circle" },
  ], "../");

  document.getElementById("welcome").innerHTML = `<p class="lead">Bienvenue, <strong>${App.escapeHtml(user.name)}</strong> 👋</p>`;

  const [results, comps] = await Promise.all([
    Results.getResultsForUser(user.id),
    Competitions.getAllCompetitionsWithLiveStatus(),
  ]);

  document.getElementById("stat-total").textContent = results.length;
  const avg = results.length ? Math.round(results.reduce((s, r) => s + r.percentage, 0) / results.length) : 0;
  document.getElementById("stat-avg").textContent = avg + "%";
  document.getElementById("stat-available").textContent = comps.filter(c => c.status === "En cours").length;

  const tbody = document.getElementById("recent-results");
  const recent = results.slice(0, 5);
  if (recent.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted-edu py-3">Aucun résultat pour le moment. <a href="competitions.html">Participez à un concours</a>.</td></tr>`;
  } else {
    tbody.innerHTML = recent.map(r => `
      <tr>
        <td>${App.escapeHtml(r.competition ? r.competition.title : '-')}</td>
        <td>${r.score} / ${r.maxScore}</td>
        <td><span class="badge bg-primary">${r.percentage}%</span></td>
        <td>${App.formatDate(r.createdAt)}</td>
      </tr>`).join("");
  }
}
init();
</script>
</body>
</html>
