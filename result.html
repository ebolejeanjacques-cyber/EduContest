<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Résultat — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9" id="content">
      <div class="text-center text-muted-edu py-5">Chargement...</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/results.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const resultId = params.get("resultId");
const wasAuto = params.get("auto") === "1";

async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["participant"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Concours disponibles", href: "competitions.html", icon: "bi-list-task" },
    { label: "Mes participations", href: "history.html", icon: "bi-clock-history", active: true },
    { label: "Classement", href: "ranking.html", icon: "bi-trophy" },
    { label: "Mon profil", href: "profile.html", icon: "bi-person-circle" },
  ], "../");

  const content = document.getElementById("content");
  const result = resultId ? await DB.get("results", resultId) : null;
  if (!result || result.userId !== user.id) {
    content.innerHTML = `<div class="alert alert-warning">Résultat introuvable.</div>`;
    return;
  }
  const comp = await DB.get("competitions", result.competitionId);
  const details = await Results.getAnswerDetails(result.participationId);

  const scoreColor = result.percentage >= 70 ? "success" : result.percentage >= 40 ? "warning" : "danger";

  content.innerHTML = `
    ${wasAuto ? `<div class="alert alert-info"><i class="bi bi-clock me-1"></i>Le temps étant écoulé, votre épreuve a été soumise automatiquement.</div>` : ""}
    <div class="card p-4 text-center mb-4">
      <h3>${App.escapeHtml(comp ? comp.title : "Concours")}</h3>
      <div class="display-4 fw-bold text-${scoreColor} my-3">${result.percentage}%</div>
      <p class="lead mb-1">Score : ${result.score} / ${result.maxScore} points</p>
      <p class="text-muted-edu">
        ${result.correctCount} bonne(s) réponse(s) · ${result.wrongCount} incorrecte(s)
        · temps utilisé : ${Math.floor(result.timeUsed / 60)} min ${result.timeUsed % 60}s
      </p>
      <div class="d-flex justify-content-center gap-2 mt-2">
        <a href="history.html" class="btn btn-outline-primary">Mes participations</a>
        <a href="ranking.html" class="btn btn-primary">Voir le classement</a>
      </div>
    </div>

    <h5 class="mb-3">Détail des réponses</h5>
    <div id="details-list"></div>
  `;

  const detailsList = document.getElementById("details-list");
  detailsList.innerHTML = details.map((d, idx) => {
    if (!d.question) return "";
    const q = d.question;
    const opts = { A: q.optionA, B: q.optionB, C: q.optionC, D: q.optionD };
    return `
      <div class="card mb-2">
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <strong>Question ${idx + 1}. ${App.escapeHtml(q.text)}</strong>
            <span class="badge bg-${d.isCorrect ? 'success' : 'danger'}">${d.isCorrect ? 'Correct' : 'Incorrect'}</span>
          </div>
          <p class="mb-1 mt-2 small">Votre réponse : <strong>${d.selected ? d.selected + '. ' + App.escapeHtml(opts[d.selected]) : 'Aucune réponse'}</strong></p>
          ${!d.isCorrect ? `<p class="mb-0 small text-success">Bonne réponse : <strong>${q.correctAnswer}. ${App.escapeHtml(opts[q.correctAnswer])}</strong></p>` : ""}
        </div>
      </div>`;
  }).join("");
}
init();
</script>
</body>
</html>
