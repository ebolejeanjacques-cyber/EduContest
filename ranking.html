<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classement — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Classement général</h2>
      <div class="table-responsive">
        <table class="table table-hover bg-white shadow-sm rounded align-middle">
          <thead class="table-light">
            <tr><th>#</th><th>Participant</th><th>Concours</th><th>Score</th><th>%</th><th>Date</th></tr>
          </thead>
          <tbody id="list"><tr><td colspan="6" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/results.js"></script>
<script src="../js/ranking.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["participant"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Concours disponibles", href: "competitions.html", icon: "bi-list-task" },
    { label: "Mes participations", href: "history.html", icon: "bi-clock-history" },
    { label: "Classement", href: "ranking.html", icon: "bi-trophy", active: true },
    { label: "Mon profil", href: "profile.html", icon: "bi-person-circle" },
  ], "../");

  const ranking = await Ranking.getGlobalRanking();
  const tbody = document.getElementById("list");
  if (ranking.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted-edu py-3">Aucun résultat pour le moment.</td></tr>`;
    return;
  }
  tbody.innerHTML = ranking.map(r => `
    <tr class="${r.userId === user.id ? 'table-warning' : ''}">
      <td><span class="rank-badge ${r.position <= 3 ? 'rank-' + r.position : ''}">${r.position}</span></td>
      <td>${App.escapeHtml(r.user ? r.user.name : '-')}${r.userId === user.id ? ' <span class="badge bg-primary">Vous</span>' : ''}</td>
      <td>${App.escapeHtml(r.competition ? r.competition.title : '-')}</td>
      <td>${r.score} / ${r.maxScore}</td>
      <td>${r.percentage}%</td>
      <td>${App.formatDate(r.createdAt)}</td>
    </tr>`).join("");
}
init();
</script>
</body>
</html>
