<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classement — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-5">
  <h2 class="section-title">Classement général</h2>
  <p class="text-muted-edu">Meilleur résultat de chaque participant, tous concours confondus.</p>

  <div class="table-responsive">
    <table class="table table-hover align-middle bg-white shadow-sm rounded overflow-hidden">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Participant</th>
          <th>Concours</th>
          <th>Score</th>
          <th>Pourcentage</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ranking-body">
        <tr><td colspan="6" class="text-center py-4 text-muted-edu">Chargement...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/results.js"></script>
<script src="../js/ranking.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  await Auth.ensureSession();
  App.renderNavbar("../");
  const ranking = await Ranking.getGlobalRanking();
  const tbody = document.getElementById("ranking-body");
  if (ranking.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted-edu">Aucun résultat pour le moment.</td></tr>`;
    return;
  }
  tbody.innerHTML = ranking.map(r => `
    <tr>
      <td><span class="rank-badge ${r.position <= 3 ? 'rank-' + r.position : ''}">${r.position}</span></td>
      <td>${App.escapeHtml(r.user ? r.user.name : 'Utilisateur supprimé')}</td>
      <td>${App.escapeHtml(r.competition ? r.competition.title : '-')}</td>
      <td>${r.score} / ${r.maxScore}</td>
      <td><span class="badge bg-primary">${r.percentage}%</span></td>
      <td>${App.formatDate(r.createdAt)}</td>
    </tr>
  `).join("");
}
init();
</script>
</body>
</html>
