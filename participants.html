<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Participants — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title" id="page-title">Participants</h2>
      <p class="small text-muted-edu">
        <i class="bi bi-broadcast me-1"></i>Liste mise à jour en temps réel : toute nouvelle
        inscription faite depuis un autre appareil apparaît ici automatiquement.
      </p>
      <div class="table-responsive">
        <table class="table bg-white shadow-sm rounded align-middle">
          <thead class="table-light">
            <tr><th>Participant</th><th>Email</th><th>Statut</th><th>Inscrit le</th><th>Score</th></tr>
          </thead>
          <tbody id="list"><tr><td colspan="5" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/participants.js"></script>
<script src="../js/results.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const competitionId = params.get("competitionId");
let comp, unsubscribe = null;

async function init() {
  await DB.openDatabase();
  const user = await App.initProtectedPage(["organizer"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Créer un concours", href: "create-competition.html", icon: "bi-plus-circle" },
    { label: "Mes concours", href: "competitions.html", icon: "bi-list-task", active: true },
  ], "../");

  comp = competitionId ? await DB.get("competitions", competitionId) : null;
  if (!comp || comp.organizerId !== user.id) {
    document.getElementById("list").innerHTML = `<tr><td colspan="5" class="text-center text-danger py-3">Accès non autorisé.</td></tr>`;
    return;
  }
  document.getElementById("page-title").textContent = `Participants — ${comp.title}`;

  // Écoute Firestore en temps réel (onSnapshot) : dès qu'un participant
  // s'inscrit depuis n'importe quel appareil, la liste se met à jour ici
  // instantanément, sans avoir besoin de recharger la page.
  unsubscribe = DB.listenQuery("participations", "competitionId", comp.id, async (participations) => {
    await renderParticipants(participations);
  });
}

async function renderParticipants(participations) {
  const tbody = document.getElementById("list");
  if (participations.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted-edu py-3">Aucun participant inscrit pour l'instant.</td></tr>`;
    return;
  }
  const users = await DB.getAll("users");
  const userMap = {};
  users.forEach(u => userMap[u.id] = u);

  const rows = [];
  for (const p of participations) {
    const user = userMap[p.userId] || null;
    let scoreCell = "-";
    if (p.status === "Terminé") {
      const result = await Results.getResultForParticipation(p.id);
      if (result) scoreCell = `${result.score} / ${result.maxScore} (${result.percentage}%)`;
    }
    rows.push(`
      <tr>
        <td>${App.escapeHtml(user ? user.name : 'Utilisateur supprimé')}</td>
        <td>${App.escapeHtml(user ? user.email : '-')}</td>
        <td><span class="badge bg-info text-dark">${p.status}</span></td>
        <td>${App.formatDate(p.startedAt)}</td>
        <td>${scoreCell}</td>
      </tr>`);
  }
  tbody.innerHTML = rows.join("");
}

window.addEventListener("beforeunload", () => { if (unsubscribe) unsubscribe(); });

init();
</script>
</body>
</html>
