<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes concours — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="section-title mb-0">Mes concours</h2>
        <a href="create-competition.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouveau concours</a>
      </div>
      <div id="alert-container"></div>
      <div class="table-responsive">
        <table class="table bg-white shadow-sm rounded align-middle">
          <thead class="table-light">
            <tr><th>Titre</th><th>Catégorie</th><th>Statut</th><th>Dates</th><th>Questions</th><th>Actions</th></tr>
          </thead>
          <tbody id="list"><tr><td colspan="6" class="text-center text-muted-edu py-3">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Modal confirmation suppression -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Supprimer le concours</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Voulez-vous vraiment supprimer <strong id="delete-comp-title"></strong> ? Toutes les questions, participations et résultats liés seront également supprimés. Cette action est irréversible.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn">Supprimer définitivement</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/competitions.js"></script>
<script src="../js/questions.js"></script>
<script>
let user, catMap = {};
let deleteTargetId = null;

async function init() {
  await DB.openDatabase();
  user = await App.initProtectedPage(["organizer"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Créer un concours", href: "create-competition.html", icon: "bi-plus-circle" },
    { label: "Mes concours", href: "competitions.html", icon: "bi-list-task", active: true },
  ], "../");

  catMap = await Competitions.getCategoryMap();
  await renderList();
}

async function renderList() {
  const comps = await Competitions.getCompetitionsByOrganizer(user.id);
  const tbody = document.getElementById("list");
  if (comps.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted-edu py-3">Vous n'avez encore créé aucun concours.</td></tr>`;
    return;
  }
  const rows = [];
  for (const c of comps) {
    const questions = await Questions.getQuestionsForCompetition(c.id);
    rows.push(`
      <tr>
        <td>${App.escapeHtml(c.title)}</td>
        <td>${App.escapeHtml(catMap[c.categoryId] || "-")}</td>
        <td>${App.statusBadgeHtml(c.status)}</td>
        <td class="small">${App.formatDate(c.startDate)} → ${App.formatDate(c.endDate)}</td>
        <td>${questions.length} / ${c.questionCount}</td>
        <td class="text-nowrap">
          <a href="questions.html?competitionId=${c.id}" class="btn btn-sm btn-outline-primary" title="Questions"><i class="bi bi-list-check"></i></a>
          <a href="create-competition.html?id=${c.id}" class="btn btn-sm btn-outline-secondary" title="Modifier"><i class="bi bi-pencil"></i></a>
          <a href="participants.html?competitionId=${c.id}" class="btn btn-sm btn-outline-info" title="Participants"><i class="bi bi-people"></i></a>
          <a href="results.html?competitionId=${c.id}" class="btn btn-sm btn-outline-success" title="Résultats"><i class="bi bi-bar-chart"></i></a>
          <button class="btn btn-sm btn-outline-danger" title="Supprimer" onclick="askDelete('${c.id}', '${App.escapeHtml(c.title).replace(/'/g, "\\'")}')"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`);
  }
  tbody.innerHTML = rows.join("");
}

function askDelete(id, title) {
  deleteTargetId = id;
  document.getElementById("delete-comp-title").textContent = title;
  bootstrap.Modal.getOrCreateInstance(document.getElementById("deleteModal")).show();
}

document.getElementById("confirm-delete-btn").addEventListener("click", async () => {
  if (!deleteTargetId) return;
  await Competitions.deleteCompetitionCascade(deleteTargetId);
  bootstrap.Modal.getInstance(document.getElementById("deleteModal")).hide();
  App.showAlert("alert-container", "Concours supprimé avec succès.", "success");
  deleteTargetId = null;
  await renderList();
});

init();
</script>
</body>
</html>
