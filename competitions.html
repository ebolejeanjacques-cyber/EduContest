<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concours disponibles — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-4">
  <div class="row">
    <div class="col-md-3 mb-4"><div id="main-sidebar"></div></div>
    <div class="col-md-9">
      <h2 class="section-title">Concours disponibles</h2>
      <p class="small text-muted-edu">
        <i class="bi bi-broadcast me-1"></i>Liste mise à jour en temps réel : un concours créé
        par un organisateur apparaît ici automatiquement, sans rechargement.
      </p>

      <form class="row g-2 mb-4" id="filter-form">
        <div class="col-md-6">
          <input type="text" class="form-control" id="search-input" placeholder="Rechercher...">
        </div>
        <div class="col-md-4">
          <select class="form-select" id="category-select"><option value="">Toutes catégories</option></select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
        </div>
      </form>

      <div class="row" id="list"><div class="col-12 text-center text-muted-edu py-4">Chargement...</div></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/database.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/competitions.js"></script>
<script>
let user, allComps = [], catMap = {}, unsubscribe = null;

async function init() {
  await DB.openDatabase();
  user = await App.initProtectedPage(["participant"], "../");
  if (!user) return;
  App.renderNavbar("../");
  App.renderSidebar([
    { label: "Tableau de bord", href: "dashboard.html", icon: "bi-speedometer2" },
    { label: "Concours disponibles", href: "competitions.html", icon: "bi-list-task", active: true },
    { label: "Mes participations", href: "history.html", icon: "bi-clock-history" },
    { label: "Classement", href: "ranking.html", icon: "bi-trophy" },
    { label: "Mon profil", href: "profile.html", icon: "bi-person-circle" },
  ], "../");

  const cats = await DB.getAll("categories");
  cats.forEach(c => { catMap[c.id] = c.name; });
  const catSelect = document.getElementById("category-select");
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id; opt.textContent = c.name;
    catSelect.appendChild(opt);
  });

  // Écoute Firestore en temps réel : un concours créé ou modifié par un
  // organisateur (sur n'importe quel appareil) apparaît ici automatiquement.
  unsubscribe = DB.listenAll("competitions", (comps) => {
    allComps = comps
      .map(c => ({ ...c, status: App.computeCompetitionStatus(c) }))
      .sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
    applyFilters();
  });
}

function applyFilters() {
  const search = document.getElementById("search-input").value;
  const categoryId = document.getElementById("category-select").value;
  render(Competitions.filterCompetitions(allComps, { search, categoryId }));
}

window.addEventListener("beforeunload", () => { if (unsubscribe) unsubscribe(); });

function render(list) {
  const el = document.getElementById("list");
  if (list.length === 0) {
    el.innerHTML = `<div class="col-12 text-center text-muted-edu py-4">Aucun concours trouvé.</div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="col-md-6 mb-4">
      <div class="card card-competition h-100" onclick="window.location.href='details.html?id=${c.id}'">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="card-cat">${App.escapeHtml(catMap[c.categoryId] || "Général")}</span>
            ${App.statusBadgeHtml(c.status)}
          </div>
          <h5 class="card-title">${App.escapeHtml(c.title)}</h5>
          <p class="card-text text-muted-edu">${App.escapeHtml(c.description).slice(0, 90)}…</p>
          <div class="small text-muted-edu">
            <i class="bi bi-calendar-event me-1"></i>${App.formatDate(c.startDate)} → ${App.formatDate(c.endDate)}
            &nbsp;·&nbsp; <i class="bi bi-stopwatch me-1"></i>${c.duration} min
          </div>
        </div>
      </div>
    </div>
  `).join("");
}

document.getElementById("filter-form").addEventListener("submit", (e) => {
  e.preventDefault();
  applyFilters();
});
document.getElementById("category-select").addEventListener("change", applyFilters);
document.getElementById("search-input").addEventListener("input", applyFilters);

init();
</script>
</body>
</html>
