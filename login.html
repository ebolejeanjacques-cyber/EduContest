<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — EduContest</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="main-navbar"></div>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-4">
        <h2 class="text-center mb-1">Connexion</h2>
        <p class="text-center text-muted-edu mb-4">Accédez à votre espace EduContest</p>

        <div id="alert-container"></div>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">Adresse email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>

        <hr class="my-4">
        <p class="small text-muted-edu mb-1"><strong>Comptes de démonstration :</strong></p>
        <ul class="small text-muted-edu">
          <li>Admin : admin@educontest.local / admin123</li>
          <li>Organisateur : organisateur@educontest.local / org123</li>
          <li>Participant : participant@educontest.local / user123</li>
        </ul>
        <p class="text-center mt-3 mb-0">Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
async function init() {
  await DB.openDatabase();
  App.renderNavbar("");

  // Si déjà connecté (session Firebase confirmée), rediriger directement.
  const existing = await Auth.ensureSession();
  if (existing) window.location.href = Auth.dashboardUrlForRole(existing.role, "");
}
init();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    const session = await Auth.loginUser(email, password);
    App.showAlert("alert-container", "Connexion réussie ! Redirection...", "success");
    setTimeout(() => {
      window.location.href = Auth.dashboardUrlForRole(session.role, "");
    }, 600);
  } catch (err) {
    App.showAlert("alert-container", err.message, "danger");
  }
});
</script>
</body>
</html>
